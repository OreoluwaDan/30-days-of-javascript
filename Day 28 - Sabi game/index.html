<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFC20E">
  <meta name="description" content="Sabi: guess the 5-letter word in six tries. A new word every day.">
  <title>Sabi, a daily word game</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FFC20E'/%3E%3Crect y='20' width='32' height='4' fill='%23141414'/%3E%3Ctext x='16' y='17' font-size='16' font-weight='800' text-anchor='middle' fill='%23141414' font-family='Arial,sans-serif'%3Es%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="band">
    <button class="icon" id="btn-help" type="button" aria-label="How to play">?</button>
    <h1>sabi</h1>
    <button class="icon" id="btn-stats" type="button" aria-label="Your stats">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
        <path d="M4 18V11M11 18V4M18 18V8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <main>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <div class="board" id="board" role="grid" aria-label="Game board"></div>
    <div class="kb" id="kb"></div>
  </main>

  <dialog id="dlg-help" aria-labelledby="help-title">
    <button class="x" type="button" data-close aria-label="Close">×</button>
    <h2 id="help-title">How to play</h2>
    <p>Guess the word in 6 tries. Each guess must be a real 5-letter word. After each guess the tiles change colour.</p>
    <ul class="legend">
      <li><span class="tile sm" data-filled="true" data-state="correct">C</span>Right letter, right spot.</li>
      <li><span class="tile sm" data-filled="true" data-state="present">R</span>Right letter, wrong spot.</li>
      <li><span class="tile sm" data-filled="true" data-state="absent">N</span>That letter isn't in the word.</li>
    </ul>
    <p>There is one new word every day.</p>
    <label class="check"><input type="checkbox" id="contrast"> High-contrast colours</label>
  </dialog>

  <dialog id="dlg-stats" aria-labelledby="stats-title">
    <button class="x" type="button" data-close aria-label="Close">×</button>
    <h2 id="stats-title">Your stats</h2>
    <dl class="nums" id="nums"></dl>
    <h3>Guess distribution</h3>
    <ol class="dist" id="dist"></ol>
    <section class="end" id="end" hidden>
      <p class="end-msg" id="end-msg"></p>
      <p class="next" id="next"></p>
      <div class="end-actions">
        <button class="btn" id="share" type="button">Share result</button>
        <button class="btn ghost" id="again" type="button">Play another word</button>
        <button class="btn ghost" id="daily" type="button" hidden>Back to today's word</button>
      </div>
    </section>
  </dialog>

  <noscript><p class="noscript">Sabi needs JavaScript to run.</p></noscript>
  <script src="script.js"></script>
</body>
</html>
