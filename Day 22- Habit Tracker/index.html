<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit tracker</title>
  <meta name="description" content="Tick off your habits each day and keep the chain going." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <h1 id="date" class="date"></h1>
      <p id="summary" class="summary" role="status"></p>
    </header>

    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden>No habits yet. Add one below, like "Read 10 pages".</p>

    <form id="add-form" class="add" autocomplete="off">
      <label class="sr-only" for="new-name">New habit</label>
      <input id="new-name" maxlength="40" placeholder="Add a habit, like Read 10 pages" />
      <button type="submit">Add habit</button>
    </form>
    <p id="form-note" class="note" role="status"></p>
    <p class="note">Your habits are saved in this browser.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
