<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <header class="mast">
      <div class="mast-inner">
        <p class="mark">Password generator</p>
        <p class="mast-note">Runs in your browser.</p>
      </div>
    </header>

    <main class="stage">
      <section class="intro">
        <p class="kicker">01 — Local tool</p>
        <h1>Password Generator</h1>
        <p class="lede">
          Pick a length, choose what goes in, then copy it into whatever you’re
          setting up. That’s the whole job.
        </p>
        <dl class="facts">
          <div>
            <dt>Entropy</dt>
            <dd id="entropy">—</dd>
          </div>
          <div>
            <dt>Strength</dt>
            <dd id="strengthLabel">—</dd>
          </div>
          <div>
            <dt>Charset</dt>
            <dd id="poolSize">—</dd>
          </div>
        </dl>
      </section>

      <section class="console" aria-label="Password generator">
        <div class="well">
          <div class="well-top">
            <span class="well-label">Output</span>
            <button type="button" id="copy" class="ghost">Copy</button>
          </div>
          <p id="pw" class="password" aria-live="polite">···············</p>
          <div class="meter" aria-hidden="true">
            <span id="meterFill"></span>
          </div>
        </div>

        <div class="control">
          <div class="len-head">
            <label for="len">Length</label>
            <output id="lenVal" for="len">16</output>
          </div>
          <input id="len" type="range" min="8" max="32" value="16" />
          <div class="len-ends">
            <span>8</span>
            <span>32</span>
          </div>
        </div>

        <fieldset class="sets">
          <legend>Character set</legend>
          <label class="chip">
            <input id="upper" type="checkbox" checked />
            <span class="chip-face">
              <span class="chip-glyph">A–Z</span>
              <span class="chip-name">Uppercase</span>
            </span>
          </label>
          <label class="chip">
            <input id="lower" type="checkbox" checked />
            <span class="chip-face">
              <span class="chip-glyph">a–z</span>
              <span class="chip-name">Lowercase</span>
            </span>
          </label>
          <label class="chip">
            <input id="number" type="checkbox" checked />
            <span class="chip-face">
              <span class="chip-glyph">0–9</span>
              <span class="chip-name">Numbers</span>
            </span>
          </label>
          <label class="chip">
            <input id="symbol" type="checkbox" />
            <span class="chip-face">
              <span class="chip-glyph">!@#</span>
              <span class="chip-name">Symbols</span>
            </span>
          </label>
        </fieldset>

        <button type="button" class="generate" id="generate">
          Generate password
        </button>
      </section>
    </main>
  </body>
</html>
