<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmark Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>Bookmark Manager</h1>
      <p class="subtitle">Save links, tag them, search and filter.</p>
    </header>

    <form id="bookmark-form" class="card" novalidate>
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="e.g. MDN Web Docs" required />
      </div>
      <div class="field">
        <label for="url">URL</label>
        <input type="text" id="url" placeholder="e.g. developer.mozilla.org" required />
      </div>
      <div class="field">
        <label for="tags">Tags (comma separated)</label>
        <input type="text" id="tags" placeholder="e.g. docs, javascript, free" />
      </div>
      <p id="form-error" class="error" role="alert"></p>
      <button type="submit" class="btn primary">Add bookmark</button>
    </form>

    <section class="controls">
      <input type="search" id="search" placeholder="Search by title, URL or tag..." />
      <div id="tag-filters" class="tag-filters"></div>
    </section>

    <p id="count" class="count"></p>
    <ul id="bookmark-list" class="bookmark-list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
