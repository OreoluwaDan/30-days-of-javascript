<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F7E7E3">
  <meta name="description" content="Count down to any date, or count up from it once it has passed.">
  <title>Countdown</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232A1115'/%3E%3Crect x='7' y='11' width='18' height='4' fill='%23F7E7E3'/%3E%3Crect x='7' y='19' width='11' height='4' fill='%23F7E7E3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="hero" aria-labelledby="ev-name">
      <h1 class="name" id="ev-name"></h1>
      <p class="when" id="when"></p>

      <div class="clock" role="timer" aria-label="Time left">
        <div class="unit" data-unit="d"><span class="num">0</span><span class="lab">days</span></div>
        <div class="unit" data-unit="h"><span class="num">00</span><span class="lab">hours</span></div>
        <div class="unit" data-unit="m"><span class="num">00</span><span class="lab">minutes</span></div>
        <div class="unit" data-unit="s"><span class="num">00</span><span class="lab">seconds</span></div>
      </div>

      <div class="track" id="track" role="progressbar" aria-label="How much of the wait is done"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="fill" id="fill"></div>
      </div>
      <p class="note" id="note"></p>
    </section>

    <section class="set" aria-labelledby="set-title">
      <h2 id="set-title">Count down to something else</h2>
      <form id="form" novalidate>
        <div class="field field--wide">
          <label for="f-name">Event name</label>
          <input id="f-name" type="text" maxlength="40" placeholder="Graduation" autocomplete="off">
        </div>
        <div class="field">
          <label for="f-date">Date</label>
          <input id="f-date" type="date" required>
        </div>
        <div class="field">
          <label for="f-time">Time</label>
          <input id="f-time" type="time" value="00:00">
        </div>
        <button class="go" type="submit">Start countdown</button>
        <p class="error" id="error" role="alert"></p>
      </form>
    </section>

    <section class="saved" aria-labelledby="saved-title">
      <h2 id="saved-title">Saved countdowns</h2>
      <ul class="list" id="list"></ul>
    </section>
  </main>

  <noscript><p class="noscript">This page needs JavaScript to run the clock.</p></noscript>
  <script src="script.js"></script>
</body>
</html>
